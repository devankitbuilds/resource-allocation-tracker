spring:
  application:
    name: tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rat_db}
    username: ${DB_USERNAME:rat_user}
    password: ${DB_PASSWORD:rat_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080
  servlet:
    context-path: /api/v1
spring:
  application:
    name: tracker
  datasource:
    url: jdbc:postgresql://localhost:5432/rat_db
    username: ${DB_USERNAME:rat_user}
    password: ${DB_PASSWORD:rat_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
app:
  jwt:
    secret: ${JWT_SECRET:}
    signing-keys: ${JWT_SIGNING_KEYS:}
    active-key-id: ${JWT_ACTIVE_KEY_ID:primary}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080
  servlet:
    context-path: /api/v1